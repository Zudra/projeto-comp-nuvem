# nginx.conf
#
# Serve o front-end (React) e funciona como proxy para a API, assim o
# navegador fala só com um endereço (http://localhost:8080).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/livros -> http://backend:3000/livros
    # "backend" é o nome do serviço no docker-compose.yml: o DNS interno
    # do Docker resolve esse nome para o IP do container da API.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # As rotas do React Router (/livros, /usuarios/3, ...) não existem
    # como arquivos. Se o arquivo pedido não existir, devolvemos o
    # index.html e o React decide qual página mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
